### A label. Names are unique per owner after normalization.
class: Tag
table: tag
fields:
  id: UuidValue?, defaultPersist=random_v7
  ownerId: UuidValue, relation(parent=serverpod_auth_core_user, onDelete=Cascade)
  normalizedName: String
  displayName: String
indexes:
  tag_owner_name_idx:
    fields: ownerId, normalizedName
    unique: true
